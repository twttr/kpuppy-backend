<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPuppy Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="{{.BasePath}}/admin/" class="text-xl font-bold">KPuppy Admin</a>
                    <a href="{{.BasePath}}/admin/" class="hover:text-indigo-200">Dashboard</a>
                    <a href="{{.BasePath}}/admin/comments" class="hover:text-indigo-200">Comments</a>
                    <a href="{{.BasePath}}/admin/users" class="hover:text-indigo-200">Users</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-8">
        {{template "content" .}}
    </main>
</body>
</html>
