{{define "content"}}
<div class="space-y-6">
    <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">Total Users</div>
            <div class="mt-2 text-3xl font-bold text-gray-900">{{.Stats.TotalUsers}}</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">Total Comments</div>
            <div class="mt-2 text-3xl font-bold text-gray-900">{{.Stats.TotalComments}}</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">Banned Users</div>
            <div class="mt-2 text-3xl font-bold text-gray-900">{{.Stats.BannedUsers}}</div>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-lg font-medium text-gray-900">Recent Comments</h2>
        </div>
        <div class="divide-y divide-gray-200">
            {{range .RecentComments}}
            <div class="px-6 py-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="font-medium text-gray-900">{{.User.Username}}</span>
                        <span class="text-gray-500 text-sm ml-2">{{.CreatedAtFormatted}}</span>
                    </div>
                </div>
                <p class="mt-1 text-gray-600">{{.Text}}</p>
            </div>
            {{else}}
            <div class="px-6 py-4 text-gray-500">No comments yet</div>
            {{end}}
        </div>
    </div>
</div>
{{end}}
